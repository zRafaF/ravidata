[project]
name = "ravidata"
version = "0.1.0"
description = "RAVIDATA: tools to record, align and analyse a 60 GHz radar + phone video + IMU dataset (RS6130)"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "h5py>=3.16.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=4.10,<5",
    "optuna>=5.0.0",
    "pyqtgraph>=0.14.0",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
    "huggingface-hub>=0.30",
]

[project.scripts]
ravidata = "ravidata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ravidata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
viz = [
    "viser>=1.1",                       # scripts/map_viz.py (3D viewer in the browser)
]
depth = [                               # scripts/static_depth.py (monocular depth on the CPU)
    "torch>=2.4",
    "transformers>=4.45",
    "pillow>=10",
]
